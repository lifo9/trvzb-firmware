# Every flashed valve and every flash, oldest first. The application MCU only
# accepts a strictly higher version, and every 64 successful updates it resets
# its update bitmap through a branch nobody has verified yet (see
# docs/update-and-recovery.md), so this log is the record of both. A release's
# MCU version must be above the installed one on every valve it goes to.
# `mcu_version` is the version a flash offered; when installation is not
# confirmed, plan the next release above it anyway.

[[device]]
label = "valve-1"

[[device.flash]]
release = "1.4.5-verstest"
date = 2026-11-12
installed_file_version = 5125
mcu_version = "1.3.2"
mcu_version_evidence = "offered; installation unknown: the MCU restarts on both transfer success and failure"

[[device.flash]]
release = "1.4.7-canary"
date = 2026-11-12
installed_file_version = 5124
mcu_version = "1.3.3"
mcu_version_evidence = "accepted: the child-lock screen shows 8C; the SoC was not re-installed (ABORT won the race), so it still runs 5124"

[[device.flash]]
release = "1.4.8-knob"
date = 2026-11-12
installed_file_version = 5124
mcu_version = "1.3.4"
mcu_version_evidence = "accepted: the woken screen shows the valve opening and the knob steps it by 10 %; the SoC was not re-installed (ABORT won), so it still runs 5124"
