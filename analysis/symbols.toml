# Named locations in the stock 1.4.4 application-MCU image (MCU firmware
# 1.3.1), as image offsets into slot A. RAM addresses are absolute.
#
# Scope: what the knob patch reads, calls, replaces or must not touch. Facts the
# patch depends on are checked against the binary in tests/test_facts.py;
# confidence states how well the *meaning* is established, not the address.

# --- Functions ----------------------------------------------------------------

